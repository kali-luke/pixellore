let last=0;
function loop(now){const dt=Math.min(64,now-last);last=now;const c=CARDS[S.active];
 if(c){if(S.playing){c.T+=dt;if(!c.counted&&c.T>=5000){c.counted=true;logAdd('c')}if(c.T>=c.total){c.T=0;c.loop++;c.ev={};c.ticks={};engineOff();c.beat=-1;if(!c.quizShown)showQuiz(c)}}render(c)}
 requestAnimationFrame(loop)}

/* posters for cards not on screen yet */
CARDS.forEach(c=>{c.T=Math.min(1600,c.total-1);render(c);resetCard(c);caption(c,c.beats[0].t)});

const io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting&&e.intersectionRatio>=.6)activate(+e.target.dataset.i)})},{root:deck,threshold:[.6]});
CARDS.forEach(c=>io.observe(c.el));

/* ---------- search ---------- */
const searchEl=document.getElementById('search'),qEl=document.getElementById('q'),resEl=document.getElementById('results');
document.getElementById('topics').innerHTML=['All',...TOPICS].map(t=>`<button class="tool topic" data-t="${t}">${t.toUpperCase()}</button>`).join('');
function matches(q){const toks=q.toLowerCase().split(/\s+/).filter(Boolean);if(!toks.length)return CARDS.slice();return CARDS.filter(c=>toks.every(k=>c.hay.includes(k)))}
function showResults(){const q=qEl.value.trim();if(!q){resEl.innerHTML='';return}const m=matches(q),safe=q.replace(/[<>&"]/g,'');
 resEl.innerHTML=m.length?`<button class="show">SHOW ${m.length} ${m.length===1?'STORY':'STORIES'}</button>`:`<p class="none">Nothing on "${safe}" yet. Try a topic below.</p>`;
 const b=resEl.querySelector('.show');if(b)b.addEventListener('click',()=>{setFilter(m,safe.toUpperCase());closeSearch()})}
function setFilter(list,label,start){S.list=list;S.label=label;document.querySelectorAll('.sbar span').forEach(e=>{e.textContent=label?label.charAt(0)+label.slice(1).toLowerCase()+'  (tap to change)':'Search'});document.querySelectorAll('.sbar').forEach(e=>e.classList.toggle('on',!!label));CARDS.forEach(c=>{c.el.hidden=!list.includes(c)});list.forEach((c,i)=>{c.countEl.textContent=label?(i+1)+'/'+list.length+'  '+label+'  X':'';c.countEl.classList.toggle('clr',!!label)});
 const tgt=start||list[0];S.active=-1;tgt.el.scrollIntoView();activate(CARDS.indexOf(tgt));list.forEach(c=>{const n=c.cap.querySelector('.next');if(n)n.textContent=nextText(c)})}
function openSearch(){searchEl.hidden=false;S.playing=false;engineOff();qEl.value='';showResults();try{qEl.focus()}catch(e){}}
function closeSearch(){searchEl.hidden=true;if(S.started){S.playing=true;const c=CARDS[S.active];if(c)c.pausedEl.hidden=true}}
qEl.addEventListener('input',showResults);
qEl.addEventListener('keydown',e=>{if(e.key==='Enter'){const m=matches(qEl.value.trim());if(m.length){setFilter(m,qEl.value.trim().toUpperCase());closeSearch()}}});
document.getElementById('sclose').addEventListener('click',closeSearch);
document.getElementById('topics').addEventListener('click',e=>{const t=e.target.closest('.topic');if(!t)return;const v=t.dataset.t;setFilter(v==='All'?CARDS.slice():CARDS.filter(c=>c.topic===v),v==='All'?'':v.toUpperCase());closeSearch()});
/* ---------- my stats ---------- */
const statsEl=document.getElementById('stats');
function dayInfo(k){const d=LOG[k]||{};return{v:d.v||0,c:d.c||0,a:DAYS[k]||0,r:d.r||0}}
function showStats(){const keys=new Set([...Object.keys(LOG).filter(k=>k!=='first'),...Object.keys(DAYS)]);
 let first=LOG.first;keys.forEach(k=>{if(!first||k<first)first=k});
 const vis=[...keys].filter(k=>{const d=dayInfo(k);return d.v||d.c||d.a});
 let tc=0,la=0,tr=0;keys.forEach(k=>{const d=dayInfo(k);tc+=d.c;tr+=d.r;la+=(LOG[k]&&LOG[k].a)||0});
 const t=dayInfo(dkey()),s=streak(),seen=SEEN.filter(id=>CARDS.some(c=>c.id===id)).length;
 const wk=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const k=dkey(d),x=dayInfo(k);wk.push(`<i class="${x.v||x.c||x.a?'on':''}">${'SMTWTFS'[d.getDay()]}</i>`)}
 const fd=first?new Date(first+'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'}).toUpperCase():'TODAY';
 const box=(n,l,w)=>`<div class="stbox${w?' wide':''}"><b>${n}</b><span>${l}</span></div>`;
 document.getElementById('stbody').innerHTML=`<div class="stgrid">
  ${box(t.c,'CARDS TODAY')}${box(t.a+' / '+GOAL,'QUESTIONS TODAY')}
  ${box(s,s===1?'DAY IN A ROW':'DAYS IN A ROW')}${box(vis.length,vis.length===1?'DAY VISITED':'DAYS VISITED')}
  <div class="stbox wide"><span style="margin-top:0">LAST 7 DAYS</span><div class="week">${wk.join('')}</div></div>
  ${box(tc,'CARDS WATCHED')}${box(la?Math.round(100*tr/la)+'%':'-','RIGHT ANSWERS')}
  ${box(seen+' / '+CARDS.length,'STORIES SEEN')}${box(fd,'FIRST VISIT')}
 </div><p class="stnote">A card counts once you watch it for 5 seconds. Your stats stay on this phone.</p>`;
 searchEl.hidden=true;statsEl.hidden=false;S.playing=false;engineOff()}
function closeStats(){statsEl.hidden=true;closeSearch()}
document.getElementById('sopen').addEventListener('click',showStats);
document.getElementById('stclose').addEventListener('click',closeStats);
window.__stats=()=>({LOG,DAYS});
/* text style switch, so clean and pixel captions can be compared */
function setFont(px){document.body.classList.toggle('pixel',px);document.getElementById('fclean').setAttribute('aria-pressed',String(!px));document.getElementById('fpixel').setAttribute('aria-pressed',String(px));try{localStorage.setItem('pixellore-reel-font2',px?'pixel':'clean')}catch(e){}}
document.getElementById('fclean').addEventListener('click',()=>setFont(false));
document.getElementById('fpixel').addEventListener('click',()=>setFont(true));
try{setFont(localStorage.getItem('pixellore-reel-font2')!=='clean')}catch(e){setFont(true)}

setFilter(CARDS.slice(),'');drawGoal();setSound();
function hideHint(){const h=document.getElementById('hint');if(!h.hidden){h.classList.add('gone');setTimeout(()=>h.hidden=true,500);try{localStorage.setItem('pixellore-reel-hinted','1')}catch(e){}}}
function begin(){if(S.started)return;try{if(!localStorage.getItem('pixellore-reel-hinted'))document.getElementById('hint').hidden=false}catch(e){}A();if(ac&&ac.state!=='running')ac.resume();document.getElementById('start').hidden=true;logAdd('v');S.started=true;S.playing=true;const c=CARDS[S.active];resetCard(c)}
const st0=document.getElementById('start');st0.addEventListener('click',begin);st0.addEventListener('touchend',e=>{e.preventDefault();begin()});
if(SEEN.length){const left=CARDS.length-SEEN.filter(id=>CARDS.some(c=>c.id===id)).length;document.getElementById('hook').textContent=left>0?'Welcome back. '+left+' cards you have not seen yet.':'Welcome back. You have seen every card. New ones are coming.';document.getElementById('play').textContent='TAP TO CARRY ON'}
{const s=streak(),n=today(),h=document.getElementById('hook');if(s>0)h.textContent=n>=GOAL?(s>1?'Goal done today. '+s+' days in a row.':'Goal done today. Come back tomorrow for day 2.'):'Day '+(s+1)+' is waiting. '+s+(s===1?' day':' days')+' in a row so far.';else if(!SEEN.length)h.textContent='Short true stories, 20 seconds each. Answer '+GOAL+' questions a day to start a streak.'}
/* iPhone: play through the silent switch, and wake sound up after the screen locks */
function wake(){if(ac&&ac.state!=='running'&&S.started)ac.resume()}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)wake()});document.addEventListener('pointerdown',wake);

/* sizing: biggest canvas that fits the scene, rechecked every frame so the quiz shrink animates */
function fit(c){const sc=c.sceneEl||(c.sceneEl=c.el.querySelector('.scene')),w=sc.clientWidth-18,h=sc.clientHeight-18-28;if(w<=0||h<=0)return;const k=Math.max(1,Math.min(w/VW,h/VH));const W=Math.floor(VW*k)+'px';if(c.cv.style.width!==W){c.cv.style.width=W;c.cv.style.height=Math.floor(VH*k)+'px'}}
CARDS.forEach(fit);addEventListener('resize',()=>CARDS.forEach(fit));
if(window.ResizeObserver){const ro=new ResizeObserver(es=>es.forEach(e=>{const c=CARDS[+e.target.closest('.card').dataset.i];if(c)fit(c)}));CARDS.forEach(c=>ro.observe(c.el.querySelector('.scene')))}
else{setInterval(()=>{const c=CARDS[S.active];if(c)fit(c)},300)}

/* test hooks */
window.__cards=()=>CARDS.map(c=>c.id);window.__C=()=>CARDS;
window.__meta=()=>CARDS.map((c,i)=>({i,id:c.id,batch:c.batch||'',topic:c.topic,start:c.start,d:c.beats.map(b=>b.d),t:c.beats.map(b=>b.t)}));
window.__go=i=>{CARDS[i].el.scrollIntoView();activate(i)};
window.__seek=ms=>{const c=CARDS[S.active];c.T=ms;c.ev={};c.ticks={};c.beat=-1;render(c)};
window.__pause=()=>{S.playing=false;engineOff()};
window.__quiz=()=>{const c=CARDS[S.active];S.playing=false;showQuiz(c)};
window.__state=()=>({active:S.active,id:CARDS[S.active].id,T:CARDS[S.active].T,loop:CARDS[S.active].loop,quiz:CARDS[S.active].quizShown,list:S.list.length});
window.__search=q=>{qEl.value=q;showResults();return matches(q).map(c=>c.id)};
requestAnimationFrame(t=>{last=t;loop(t)});
})();
</script>
